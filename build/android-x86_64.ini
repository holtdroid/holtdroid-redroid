[binaries]
ar = '/w/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
c = '/w/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android@API@-clang'
cpp = ['/w/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android@API@-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
c_ld = 'lld'
cpp_ld = 'lld'
strip = '/w/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
