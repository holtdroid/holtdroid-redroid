name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: make check

  image:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android: ["15", "14", "13", "12", "11"]
    steps:
      - uses: actions/checkout@v5
      - id: pins
        run: |
          { echo 'args<<EOF'; cat "versions/${{ matrix.android }}.env"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.android }},enable={{is_default_branch}}
            type=sha,format=long,prefix=${{ matrix.android }}-
            type=ref,event=branch,enable=${{ matrix.android == '15' }}
            type=semver,pattern={{version}},prefix=${{ matrix.android }}-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: ${{ steps.pins.outputs.args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=android-${{ matrix.android }}
          cache-to: type=gha,mode=max,scope=android-${{ matrix.android }}
